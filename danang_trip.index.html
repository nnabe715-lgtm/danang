<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>DA NANG · HOI AN — 여행 여권</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700;900&family=Noto+Sans+KR:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12211d;
  --passport:#173f34;
  --passport-2:#0f2e26;
  --gold:#c9a24b;
  --gold-soft:#e4cd93;
  --coral:#e2603a;
  --paper:#f7f1e3;
  --paper-2:#efe4c8;
  --card:#fffdf7;
  --line:#d9cba4;
  --ink-soft:#5b6b62;
  --danger:#b5432f;
  --ok:#3c7a58;
  --shadow: 0 10px 30px rgba(15,46,38,.15);
  --radius: 16px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background: var(--passport-2);
  font-family:'Noto Sans KR',sans-serif;
  color:var(--ink);
  display:flex;
  justify-content:center;
  min-height:100vh;
}
.app{
  width:100%;
  max-width:480px;
  min-height:100vh;
  background:var(--paper);
  position:relative;
  display:flex;
  flex-direction:column;
  box-shadow: 0 0 60px rgba(0,0,0,.35);
}

/* ---------- COVER HEADER ---------- */
.cover{
  background:
    radial-gradient(circle at 85% -10%, rgba(201,162,75,.25), transparent 55%),
    linear-gradient(160deg, var(--passport), var(--passport-2));
  color:var(--gold-soft);
  padding:22px 20px 18px;
  position:relative;
  border-bottom:4px double var(--gold);
}
.cover::before{
  content:"";
  position:absolute; inset:8px;
  border:1px solid rgba(228,205,147,.35);
  border-radius:6px;
  pointer-events:none;
}
.cover-top{
  display:flex; justify-content:space-between; align-items:flex-start;
  font-family:'Space Mono',monospace;
  font-size:11px; letter-spacing:.12em; opacity:.85;
}
.emblem{
  width:34px;height:34px;
  border:1.5px solid var(--gold);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  margin-bottom:10px;
}
.emblem svg{width:18px;height:18px;fill:var(--gold-soft);}
.cover h1{
  font-family:'Noto Serif KR',serif;
  font-weight:900;
  font-size:26px;
  margin:2px 0 2px;
  letter-spacing:.02em;
  text-shadow:0 1px 0 rgba(0,0,0,.3);
}
.cover .sub{
  font-size:12.5px;
  color:var(--gold-soft);
  opacity:.9;
  margin-bottom:14px;
}
.cover-row{
  display:flex; gap:8px; align-items:center; flex-wrap:wrap;
}
.chip{
  font-family:'Space Mono',monospace;
  font-size:11px;
  border:1px solid rgba(228,205,147,.5);
  color:var(--gold-soft);
  padding:4px 9px;
  border-radius:999px;
  background:rgba(255,255,255,.04);
}
.chip.strong{
  background:var(--gold);
  color:var(--passport-2);
  border-color:var(--gold);
  font-weight:700;
}
#dday{font-weight:700;}

/* ---------- TABS (luggage tags) ---------- */
.tabs-wrap{
  background:var(--paper-2);
  border-bottom:1px solid var(--line);
  padding:10px 10px 0;
  position:sticky; top:0; z-index:20;
}
.tabs{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:10px;
  scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none;}
.tag-btn{
  flex:0 0 auto;
  position:relative;
  font-family:'Noto Sans KR',sans-serif;
  font-weight:700;
  font-size:12.5px;
  color:var(--ink-soft);
  background:var(--card);
  border:1px solid var(--line);
  border-radius:8px 8px 8px 2px;
  padding:9px 14px 9px 20px;
  cursor:pointer;
  white-space:nowrap;
  transition:transform .15s ease, box-shadow .15s ease, color .15s ease, background .15s ease;
}
.tag-btn::before{
  content:"";
  position:absolute; left:7px; top:50%; transform:translateY(-50%);
  width:6px;height:6px;border-radius:50%;
  background:var(--paper-2);
  border:1px solid var(--ink-soft);
}
.tag-btn small{display:block;font-family:'Space Mono',monospace;font-weight:400;font-size:9px;color:var(--ink-soft);letter-spacing:.06em;}
.tag-btn.active{
  background:var(--passport);
  color:var(--gold-soft);
  border-color:var(--passport);
  transform:translateY(-2px);
  box-shadow:0 6px 14px rgba(23,63,52,.35);
}
.tag-btn.active small{color:var(--gold-soft);opacity:.75;}
.tag-btn.stamped::after{
  content:"완료";
  position:absolute; top:-9px; right:-6px;
  font-family:'Space Mono',monospace;
  font-size:9px; font-weight:700;
  color:#fff; background:var(--coral);
  padding:2px 5px; border-radius:4px;
  transform:rotate(8deg);
  box-shadow:0 2px 4px rgba(0,0,0,.25);
}

/* ---------- PAGES ---------- */
main{flex:1; padding:16px 16px 100px;}
.page{display:none; animation:fade .25s ease;}
.page.active{display:block;}
@keyframes fade{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

.section-title{
  font-family:'Noto Serif KR',serif;
  font-weight:900;
  font-size:16px;
  color:var(--passport);
  margin:22px 0 10px;
  display:flex; align-items:center; gap:8px;
}
.section-title:first-child{margin-top:0;}
.section-title .num{
  font-family:'Space Mono',monospace;
  font-size:11px;
  color:var(--coral);
  border:1px solid var(--coral);
  border-radius:4px;
  padding:1px 5px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:14px;
  margin-bottom:12px;
  box-shadow:var(--shadow);
}
.card h3{margin:0 0 6px; font-size:14.5px; font-family:'Noto Serif KR',serif; color:var(--ink);}
.muted{color:var(--ink-soft); font-size:12.5px; line-height:1.6;}

/* schedule item */
.item{
  background:var(--card);
  border:1px solid var(--line);
  border-left:4px solid var(--passport);
  border-radius:0 var(--radius) var(--radius) 0;
  padding:12px 13px;
  margin-bottom:10px;
  box-shadow:var(--shadow);
}
.item-head{display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:6px;}
.time-badge{
  font-family:'Space Mono',monospace;
  font-size:11px; font-weight:700;
  color:var(--passport);
  background:var(--paper-2);
  border-radius:6px; padding:3px 8px;
}
.map-btn{
  font-family:'Noto Sans KR',sans-serif;
  font-size:11px; font-weight:700;
  color:#fff; background:var(--coral);
  border:none; border-radius:999px;
  padding:5px 10px; text-decoration:none;
  display:inline-flex; align-items:center; gap:4px;
  white-space:nowrap;
}
.item textarea{
  width:100%;
  border:none;
  background:transparent;
  font-family:'Noto Sans KR',sans-serif;
  font-size:13.5px;
  line-height:1.6;
  color:var(--ink);
  resize:none;
  padding:0;
  min-height:24px;
}
.item textarea:focus{outline:none;}
.tip{
  margin-top:8px;
  background:#fbf3df;
  border:1px dashed var(--gold);
  border-radius:10px;
  padding:8px 10px;
  font-size:12px;
  line-height:1.6;
  color:#6b5424;
}
.tip b{color:var(--coral);}
.save-note{font-size:10px; color:var(--ok); opacity:0; transition:opacity .3s; font-family:'Space Mono',monospace;}
.save-note.show{opacity:1;}

/* checklist */
.checklist{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:14px;
  margin-top:6px;
}
.check-row{display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid var(--paper-2);}
.check-row:last-of-type{border-bottom:none;}
.check-row input[type=checkbox]{width:17px;height:17px; accent-color:var(--coral); flex:0 0 auto;}
.check-row span{flex:1; font-size:13px;}
.check-row span.done{text-decoration:line-through; color:var(--ink-soft);}
.check-row .del{background:none;border:none;color:var(--ink-soft);font-size:15px;cursor:pointer;padding:2px 4px;}
.add-row{display:flex; gap:6px; margin-top:8px;}
.add-row input{
  flex:1; border:1px solid var(--line); border-radius:8px;
  padding:8px 10px; font-size:13px; font-family:inherit;
}
.add-row button{
  background:var(--passport); color:var(--gold-soft); border:none;
  border-radius:8px; padding:8px 14px; font-weight:700; font-size:13px; cursor:pointer;
}

/* photo journal */
.photo-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-top:8px;}
.photo-grid .ph{position:relative; aspect-ratio:1; border-radius:8px; overflow:hidden; border:1px solid var(--line);}
.photo-grid .ph img{width:100%;height:100%;object-fit:cover; display:block;}
.photo-grid .ph button{
  position:absolute; top:3px; right:3px; width:18px;height:18px; border-radius:50%;
  border:none; background:rgba(0,0,0,.55); color:#fff; font-size:11px; line-height:1; cursor:pointer;
}
.upload-btn{
  display:inline-flex; align-items:center; gap:6px;
  border:1.5px dashed var(--passport); color:var(--passport);
  background:transparent; border-radius:10px; padding:9px 13px;
  font-weight:700; font-size:12.5px; cursor:pointer; margin-top:8px;
}
.upload-btn input{display:none;}

.fx-mini-box{
  margin-top:8px; display:flex; align-items:center; justify-content:space-between; gap:8px;
  background:var(--paper-2); border-radius:8px; padding:8px 10px;
}
.fx-mini-box span{font-family:'Space Mono',monospace; font-size:12px; font-weight:700; color:var(--passport);}

/* home widgets */
.widget-row{display:flex; gap:10px;}
.widget-row .card{flex:1;}
.fx-value{font-family:'Space Mono',monospace; font-size:20px; font-weight:700; color:var(--passport); margin:4px 0;}
.fx-conv{display:flex; gap:6px; margin-top:8px;}
.fx-conv input{flex:1; border:1px solid var(--line); border-radius:8px; padding:8px; font-size:13px; font-family:'Space Mono',monospace;}
.fx-conv .out{display:flex;align-items:center; font-family:'Space Mono',monospace; font-size:13px; font-weight:700; color:var(--coral); white-space:nowrap;}
.weather-strip{display:flex; gap:8px; overflow-x:auto; margin-top:6px;}
.wday{flex:0 0 auto; width:76px; text-align:center; background:var(--paper-2); border-radius:10px; padding:8px 4px;}
.wday .d{font-size:11px; font-weight:700; color:var(--ink-soft);}
.wday .ic{font-size:20px; margin:4px 0;}
.wday .t{font-family:'Space Mono',monospace; font-size:11.5px;}
.small-note{font-size:11px; color:var(--ink-soft); margin-top:6px;}

.safety-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; text-align:center;}
.safety-grid a{
  display:block; text-decoration:none; color:var(--ink);
  background:var(--paper-2); border-radius:10px; padding:10px 4px;
  font-size:11.5px; font-weight:700;
}
.safety-grid a b{display:block; font-family:'Space Mono',monospace; font-size:16px; color:var(--danger); margin-bottom:2px;}

.list-plain{margin:0; padding-left:18px; font-size:12.5px; line-height:1.75; color:var(--ink);}
.list-plain li{margin-bottom:2px;}

/* FAB */
.fab-group{
  position:fixed; bottom:18px; right:calc(50% - 240px + 18px);
  display:flex; flex-direction:column; gap:10px; z-index:30;
}
@media (max-width:480px){ .fab-group{right:18px;} }
.fab{
  width:50px;height:50px;border-radius:50%;
  background:var(--passport); color:var(--gold-soft);
  border:2px solid var(--gold);
  display:flex; align-items:center; justify-content:center;
  font-size:20px; box-shadow:0 8px 18px rgba(0,0,0,.3);
  cursor:pointer;
}

/* modal */
.modal{
  position:fixed; inset:0; background:rgba(15,30,25,.55);
  display:flex; align-items:flex-end; justify-content:center; z-index:50;
}
.modal.hidden{display:none;}
.modal-inner{
  width:100%; max-width:480px; background:var(--paper); border-radius:20px 20px 0 0;
  padding:16px; box-shadow:0 -10px 30px rgba(0,0,0,.3);
}
.modal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
.modal-head h3{margin:0; font-family:'Noto Serif KR',serif; color:var(--passport);}
.modal-head button{background:none;border:none;font-size:20px;cursor:pointer;color:var(--ink-soft);}
#calc-display{
  background:var(--ink); color:#fff; font-family:'Space Mono',monospace;
  font-size:26px; text-align:right; padding:16px; border-radius:10px; margin-bottom:10px; word-break:break-all;
}
.calc-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
.calc-grid button{
  padding:16px 0; font-size:17px; border:none; border-radius:10px; background:var(--card);
  box-shadow:0 2px 6px rgba(0,0,0,.08); cursor:pointer; font-family:'Space Mono',monospace; font-weight:700; color:var(--ink);
}
.calc-grid button.op{background:var(--passport); color:var(--gold-soft);}
.calc-grid button.eq{background:var(--coral); color:#fff;}
.calc-grid button.wide{grid-column:span 2;}

footer{
  text-align:center; font-size:10.5px; color:var(--ink-soft);
  padding:14px 20px 90px; font-family:'Space Mono',monospace; opacity:.7;
}
</style>
</head>
<body>
<div class="app">

  <div class="cover">
    <div class="cover-top">
      <span>PASSPORT · TRAVEL COMPANION</span>
      <span id="dday">D-–</span>
    </div>
    <div class="emblem">
      <svg viewBox="0 0 24 24"><path d="M2 16l20-7-3 9-5-2-4 4-1-5-4-1z"/></svg>
    </div>
    <h1>DA NANG · HOI AN</h1>
    <div class="sub">2026.08.16 (일) — 2026.08.20 (목) · 제주항공 7C</div>
    <div class="cover-row">
      <span class="chip strong">ICN → DAD → ICN</span>
      <span class="chip">예약번호 G9RMVC</span>
    </div>
  </div>

  <div class="tabs-wrap">
    <div class="tabs" id="tabs"></div>
  </div>

  <main id="pages"></main>

  <footer>이 페이지에 적은 메모·체크리스트·사진은 자동으로 저장됩니다 · 여행 잘 다녀오세요 ✈</footer>
</div>

<div class="fab-group">
  <div class="fab" id="fab-lens" title="구글 렌즈">🔍</div>
  <div class="fab" id="fab-calc" title="계산기">🧮</div>
</div>

<div class="modal hidden" id="calc-modal">
  <div class="modal-inner">
    <div class="modal-head"><h3>계산기</h3><button id="calc-close">✕</button></div>
    <div id="calc-display">0</div>
    <div class="calc-grid" id="calc-grid"></div>
  </div>
</div>

<script>
/* ============ STORAGE HELPERS ============ */
async function sGet(key, fallback){
  try{
    const r = await window.storage.get(key,false);
    return r ? r.value : fallback;
  }catch(e){ return fallback; }
}
async function sSet(key, val){
  try{ await window.storage.set(key, val, false); }catch(e){}
}

function debounce(fn, ms){
  let t;
  return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a), ms); };
}

    {t:'01:30', title:'그랩 타고 숙소 이동', body:'그랩 택시 타고 숙소로 이동, 체크인', map:'노보텔 다낭 프리미어 한 리버',

    {t:'숙소', title:'노보텔 다낭 프리미어 한 리버', body:'체크인 완료', map:'Novotel Danang Premier Han River'}
  ],
  checklistSeed:['여권 유효기간 확인','항공권/예약 캡처','유심 또는 이심 준비','보조배터리 기내 반입','충전기/멀티탭']
},
{
  id:'day2', label:'2일차', date:'8.17 월', theme:'마사지×2 · 망고',
  items:[

/* ---- DAY-LEVEL MAP LINK (하나로 합친 지도) ---- */
function buildDayMapUrl(day){
  const raw = day.items.map(it=>it.map).filter(Boolean);
  const seen = new Set();
  const points = raw.filter(p=>{ if(seen.has(p)) return false; seen.add(p); return true; });
  if(points.length===0) return null;
  const withCity = p => /Vietnam|Da Nang|Hoi An/i.test(p) ? p : (p+' Da Nang');
  if(points.length===1){
    return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(withCity(points[0]))}`;
  }
  const origin = encodeURIComponent(withCity(points[0]));
  const destination = encodeURIComponent(withCity(points[points.length-1]));
  const waypoints = points.slice(1,-1).map(p=>encodeURIComponent(withCity(p))).join('|');
  return `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${destination}${waypoints?`&waypoints=${waypoints}`:''}&travelmode=driving`;
}

async function loadChecklist(dayId, seed){
  const raw = await sGet('checklist_'+dayId, null);
  if(raw) return JSON.parse(raw);
  return seed.map(text=>({text, done:false}));
}
async function saveChecklist(dayId, arr){
  await sSet('checklist_'+dayId, JSON.stringify(arr));
  updateStamp(dayId, arr);
}
function updateStamp(dayId, arr){
  const tab = document.querySelector(`.tag-btn[data-target="${dayId}"]`);
  if(!tab) return;
  const allDone = arr.length>0 && arr.every(i=>i.done);
  tab.classList.toggle('stamped', allDone);
}
function renderChecklist(dayId, arr){
  const c = document.getElementById('check_'+dayId);
  c.innerHTML = arr.map((it,i)=>`
    <div class="check-row">
      <input type="checkbox" data-day="${dayId}" data-i="${i}" ${it.done?'checked':''}>
      <span class="${it.done?'done':''}">${it.text}</span>
      <button class="del" data-day="${dayId}" data-i="${i}">✕</button>
    </div>`).join('') || '<div class="muted">아직 항목이 없어요. 아래에서 추가해보세요.</div>';
}
DAYS.forEach(async day=>{
  let arr = await loadChecklist(day.id, day.checklistSeed);
  renderChecklist(day.id, arr);
  updateStamp(day.id, arr);

  document.getElementById('check_'+day.id).addEventListener('change', async e=>{
    if(e.target.type!=='checkbox') return;
    const i = +e.target.dataset.i;
    arr[i].done = e.target.checked;
    renderChecklist(day.id, arr);
    await saveChecklist(day.id, arr);
  });
  document.getElementById('check_'+day.id).addEventListener('click', async e=>{
    if(!e.target.classList.contains('del')) return;

    await saveChecklist(day.id, arr);
  });
});

/* ============ PHOTO JOURNAL ============ */
function resizeImage(file, maxW=800, quality=0.72){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    const reader = new FileReader();
    reader.onload = e=>{ img.src = e.target.result; };
    reader.onerror = reject;
    img.onload = ()=>{
      const scale = Math.min(1, maxW/img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width*scale;
      canvas.height = img.height*scale;
      canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function loadPhotos(dayId){
  const raw = await sGet('photos_'+dayId, null);
  return raw ? JSON.parse(raw) : [];
}
async function savePhotos(dayId, arr){ await sSet('photos_'+dayId, JSON.stringify(arr)); }
function renderPhotos(dayId, arr){
  const el = document.getElementById('photos_'+dayId);
  el.innerHTML = arr.map((src,i)=>`
    <div class="ph"><img src="${src}"><button data-day="${dayId}" data-i="${i}">✕</button></div>
  `).join('');
}
DAYS.forEach(async day=>{
  const arr = await loadPhotos(day.id);
  renderPhotos(day.id, arr);
  document.getElementById('photos_'+day.id).addEventListener('click', async e=>{
    if(e.target.tagName!=='BUTTON') return;
    const i = +e.target.dataset.i;
    const cur = await loadPhotos(day.id);
    cur.splice(i,1);
    await savePhotos(day.id, cur);
    renderPhotos(day.id, cur);
  });
});
document.querySelectorAll('.photo-input').forEach(inp=>{
  inp.addEventListener('change', async e=>{
    const file = e.target.files[0];
    if(!file) return;
    const dayId = inp.dataset.day;
    try{
      const dataUrl = await resizeImage(file);
      const cur = await loadPhotos(dayId);
      cur.push(dataUrl);
      await savePhotos(dayId, cur);
      renderPhotos(dayId, cur);
    }catch(err){ alert('사진을 불러오지 못했어요. 다른 사진으로 시도해주세요.'); }
    inp.value='';
  });
});

/* ============ EXCHANGE RATE ============ */
async function loadFx(){
  const rateEl = document.getElementById('fx-rate');
  const upEl = document.getElementById('fx-updated');
  try{
    const res = await fetch('https://open.er-api.com/v6/latest/KRW');
    const data = await res.json();
    const vnd = data.rates.VND;
    window.__krwToVnd = vnd;
    rateEl.textContent = `1 KRW ≈ ${vnd.toFixed(2)} VND`;
    upEl.textContent = '업데이트: ' + new Date(data.time_last_update_utc).toLocaleString('ko-KR');
    updateFxCalc();
    const miniEl = document.getElementById('fx-mini-rate');
    if(miniEl) miniEl.textContent = `1 KRW ≈ ${vnd.toFixed(2)} VND`;
  }catch(e){
    rateEl.textContent = '실시간 환율을 불러오지 못했어요';
    upEl.textContent = '와이파이/데이터 연결을 확인해주세요';
  }
}
function updateFxCalc(){
  const input = document.getElementById('fx-input');
  const out = document.getElementById('fx-output');
  if(!window.__krwToVnd){ out.textContent='= –'; return; }
  const v = parseFloat(input.value)||0;
  out.textContent = '= ' + Math.round(v*window.__krwToVnd).toLocaleString() + ' 동';
}
document.getElementById('fx-input').addEventListener('input', updateFxCalc);
loadFx();

/* ============ WEATHER ============ */
async function loadWeather(){
  const strip = document.getElementById('weather-strip');
  const codeIcon = c=>{
    if(c===0) return '☀️';
    if([1,2].includes(c)) return '🌤';
    if(c===3) return '☁️';
    if([45,48].includes(c)) return '🌫';
    if([51,53,55,61,63,80,81].includes(c)) return '🌦';
    if([65,82].includes(c)) return '🌧';
    if([95,96,99].includes(c)) return '⛈';
    return '🌤';
  };
  try{
    const url = 'https://api.open-meteo.com/v1/forecast?latitude=16.0544&longitude=108.2022&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_mean&timezone=Asia%2FBangkok&start_date=2026-08-16&end_date=2026-08-20';
    const res = await fetch(url);
    const data = await res.json();
    const days = data.daily.time;
    strip.innerHTML = days.map((d,i)=>`
      <div class="wday">
        <div class="d">${d.slice(5).replace('-','.')}</div>
        <div class="ic">${codeIcon(data.daily.weathercode[i])}</div>
        <div class="t">${Math.round(data.daily.temperature_2m_min[i])}~${Math.round(data.daily.temperature_2m_max[i])}℃</div>
        <div class="t" style="opacity:.6">☔${data.daily.precipitation_probability_mean[i]}%</div>
      </div>`).join('');
  }catch(e){
    strip.innerHTML = '<span class="muted">예보를 불러오지 못했어요. 8월 다낭 평균은 25~33℃, 늦은 오후 짧은 소나기가 가끔 있어요.</span>';
  }
}
loadWeather();

/* ============ FAB: LENS & CALCULATOR ============ */
document.getElementById('fab-lens').onclick = ()=> window.open('https://lens.google.com/','_blank');

const calcModal = document.getElementById('calc-modal');
const calcDisplay = document.getElementById('calc-display');
document.getElementById('fab-calc').onclick = ()=> calcModal.classList.remove('hidden');
document.getElementById('calc-close').onclick = ()=> calcModal.classList.add('hidden');

let calcExpr = '';
const keys = ['7','8','9','÷','4','5','6','×','1','2','3','−','0','.','⌫','+','C','='];
const grid = document.getElementById('calc-grid');
keys.forEach(k=>{
  const b = document.createElement('button');
  b.textContent = k;
  if(['÷','×','−','+'].includes(k)) b.className='op';
  if(k==='=') b.className='eq wide';
  if(k==='C') b.className='op';
  b.onclick = ()=>handleCalc(k);
  grid.appendChild(b);
});
function handleCalc(k){
  if(k==='C'){ calcExpr=''; }
  else if(k==='⌫'){ calcExpr = calcExpr.slice(0,-1); }
  else if(k==='='){
    try{
      const safe = calcExpr.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');
      if(!/^[0-9+\-*/.() ]+$/.test(safe)) throw new Error('invalid');
      calcExpr = String(Function('"use strict";return ('+safe+')')());
    }catch(e){ calcExpr = 'Error'; }
  } else {
    calcExpr += k;
  }
  calcDisplay.textContent = calcExpr || '0';
}
</script>
